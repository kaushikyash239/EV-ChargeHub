<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV ChargeHub - Find, Book &amp; Charge</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-primary: #15803d;
      --color-primary-dark: #0f5c2c;
      --color-primary-light: #22c55e;
      --color-primary-soft: #e7f6ec;
      --color-bg: #f7f9f8;
      --color-surface: #ffffff;
      --color-text: #1f2937;
      --color-text-muted: #6b7280;
      --color-border: #e5e7eb;
      --color-danger: #dc2626;
      --shadow-card: 0 1px 3px rgba(16, 24, 40, .08), 0 1px 2px rgba(16, 24, 40, .04);
      --radius-md: 10px;
      --radius-lg: 16px;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html.dark {
      --color-primary-soft: rgba(34, 197, 94, .16);
      --color-bg: #0f172a;
      --color-surface: #1e293b;
      --color-text: #e5e7eb;
      --color-text-muted: #94a3b8;
      --color-border: #334155;
      --shadow-card: 0 1px 3px rgba(0, 0, 0, .4), 0 1px 2px rgba(0, 0, 0, .3);
    }

    html.dark body {
      color-scheme: dark;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes user-location-pulse {
      0%   { transform: scale(.4); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    html.dark .leaflet-popup-content-wrapper,
    html.dark .leaflet-popup-tip {
      background: var(--color-surface);
      color: var(--color-text);
    }

    html.dark .leaflet-control-zoom a {
      background: var(--color-surface);
      color: var(--color-text);
      border-color: var(--color-border);
    }
  </style>
</head>

<body class="flex flex-col min-h-screen font-sans text-text bg-bg antialiased">

  <header id="navbar" class="sticky top-0 w-full z-[1000] bg-surface border-b border-border">
    <div class="max-w-[80rem] mx-auto px-6 py-3.5 flex items-center justify-between gap-6">
      <a href="#" class="flex items-center shrink-0 gap-2.5 font-bold text-lg" data-page="home">
        <img src="assets/images/logo.png" alt="EV ChargeHub logo" class="w-7.5 h-7.5" />
        <span>EV ChargeHub</span>
      </a>

      <nav id="navbar-links"
        class="flex items-center flex-1 justify-center gap-8
               max-[860px]:hidden max-[860px]:absolute max-[860px]:top-full max-[860px]:inset-x-0
               max-[860px]:flex-col max-[860px]:items-start max-[860px]:gap-3.5
               max-[860px]:bg-surface max-[860px]:border-b max-[860px]:border-border
               max-[860px]:px-6 max-[860px]:py-4 max-[860px]:[&.open]:flex">
        <a href="#" data-page="home" class="nav-link font-medium text-text-muted pb-1.5 border-b-2 border-transparent transition-colors duration-150 hover:text-text [&.active]:text-primary [&.active]:border-primary [&.active]:font-semibold">Home</a>
        <a href="#" data-page="stations" class="nav-link font-medium text-text-muted pb-1.5 border-b-2 border-transparent transition-colors duration-150 hover:text-text [&.active]:text-primary [&.active]:border-primary [&.active]:font-semibold">Find Stations</a>
        <a href="#" data-page="bookings" class="nav-link font-medium text-text-muted pb-1.5 border-b-2 border-transparent transition-colors duration-150 hover:text-text [&.active]:text-primary [&.active]:border-primary [&.active]:font-semibold">My Bookings</a>
        <a href="#" data-page="contact" class="nav-link font-medium text-text-muted pb-1.5 border-b-2 border-transparent transition-colors duration-150 hover:text-text [&.active]:text-primary [&.active]:border-primary [&.active]:font-semibold">Contact</a>
        <a href="#" data-page="admin" id="admin-dashboard-link"
  class="hidden nav-link font-medium text-text-muted pb-1.5 border-b-2 border-transparent
         transition-colors duration-150 hover:text-text
         [&.active]:text-primary [&.active]:border-primary
         [&.active]:font-semibold">
  Admin Dashboard
</a>
      </nav>

      <div class="flex items-center shrink-0 gap-3" id="navbar-auth">
        <a href="#" data-page="login" id="btn-login"
           class="inline-flex items-center justify-center gap-2 font-semibold whitespace-nowrap cursor-pointer border border-transparent rounded-md transition duration-150 active:translate-y-px text-base px-5.5 py-3 bg-surface text-text border-border hover:border-primary hover:text-primary">Login</a>
        <a href="#" data-page="login" id="btn-register"
           class="inline-flex items-center justify-center gap-2 font-semibold whitespace-nowrap cursor-pointer border border-transparent rounded-md transition duration-150 active:translate-y-px text-base px-5.5 py-3 text-white bg-primary hover:bg-primary-dark">Register</a>

        <div class="relative hidden" id="notification-menu">
          <button class="relative flex items-center justify-center cursor-pointer rounded-full bg-transparent border-none text-lg text-text w-9.5 h-9.5 hover:bg-bg" id="notification-trigger" aria-label="Notifications">
            <i class="fa-solid fa-bell"></i>
            <span class="!hidden absolute flex items-center justify-center rounded-full bg-danger text-white text-xs font-bold min-w-4 h-4 px-1 top-0.5 right-0.5" id="notification-badge">0</span>
          </button>
          <div class="hidden absolute overflow-hidden right-0 top-[calc(100%+0.6rem)] bg-surface border border-border rounded-md shadow-card w-80 max-w-[85vw] [&.open]:block" id="notification-dropdown">
            <div class="font-bold text-sm px-4 py-3.5 border-b border-border">Notifications</div>
            <div id="notification-list" class="max-h-80 overflow-y-auto">
              <p class="text-center px-4 py-12 text-text-muted">No notifications yet.</p>
            </div>
          </div>
        </div>

        <div class="relative hidden" id="profile-menu">
          <button class="flex items-center cursor-pointer bg-transparent border-none font-sans gap-2 text-sm font-semibold text-text" id="profile-trigger">
            <div class="flex items-center justify-center rounded-full text-white font-bold shrink-0 bg-primary tracking-[0.02em] w-8.5 h-8.5 text-sm" id="navbar-avatar"></div>
            <span id="navbar-username">Account</span>
            <i class="fa-solid fa-chevron-down"></i>
          </button>
          <div class="hidden absolute overflow-hidden right-0 top-[calc(100%+0.6rem)] bg-surface border border-border rounded-md shadow-card min-w-40 [&.open]:block" id="profile-dropdown">
            <a href="#" data-page="profile" class="block px-4 py-2.5 text-sm text-text hover:bg-bg">My Profile</a>
            <a href="#" data-page="admin" id="admin-profile-link"
   class="hidden block px-4 py-2.5 text-sm text-text hover:bg-bg">
  <i class="fa-solid fa-gauge-high mr-2"></i>
  Admin Dashboard
</a>
<div class="flex items-center justify-between gap-3 px-4 py-2.5 text-sm text-text border-t border-b border-border cursor-pointer select-none" id="theme-toggle-row">              <span class="flex items-center gap-2"><i class="fa-solid fa-moon"></i> Night Drive Mode</span>
              <label class="relative shrink-0 w-9 h-5 inline-block">
                <input type="checkbox" id="theme-toggle-input" class="opacity-0 w-0 h-0 peer" />
                <span class="absolute inset-0 cursor-pointer rounded-full bg-border transition-colors duration-150 peer-checked:bg-primary
                             before:content-[''] before:absolute before:rounded-full before:w-4 before:h-4 before:left-0.5 before:top-0.5 before:bg-white before:transition-transform before:duration-150 peer-checked:before:translate-x-4"></span>
              </label>
            </div>
            <a href="#" id="btn-logout" class="block px-4 py-2.5 text-sm text-text hover:bg-bg">Logout</a>
          </div>
        </div>
      </div>

      <button class="hidden cursor-pointer bg-transparent border-none text-xl text-text max-[860px]:block" id="navbar-burger" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <main id="app-content" class="flex-1 max-w-7xl mx-auto w-full p-6 max-[768px]:p-4"></main>

  <footer class="text-center px-6 py-6 text-text-muted text-sm border-t border-border bg-surface">
    <p>&copy; <span id="footer-year"></span> EV ChargeHub. All rights reserved.</p>
  </footer>

  <div class="hidden fixed inset-0 items-center justify-center bg-[rgba(15,23,42,0.45)] p-4 z-[200] [&.open]:flex" id="modal-overlay">
    <div class="bg-surface rounded-lg shadow-card w-full overflow-y-auto max-w-[440px] max-h-[88vh]">
      <div class="flex items-center justify-between px-5.5 py-4.5 border-b border-border">
        <h3 id="modal-title" class="m-0 text-base"></h3>
        <button class="cursor-pointer rounded-full bg-transparent border-none text-lg text-text-muted w-7.5 h-7.5 hover:bg-bg hover:text-text" id="modal-close-btn" aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-5.5" id="modal-body"></div>
    </div>
  </div>

  <div class="fixed flex flex-col top-20 right-5 z-[300] gap-2.5 max-w-[320px]" id="toast-stack"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
